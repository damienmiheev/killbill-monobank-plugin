name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste merchant tokens, card tokens, webhook bodies or customer data. Security problems go to
        "Report a security vulnerability" instead.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, Kill Bill version, database
      placeholder: "plugin 0.1.0, Kill Bill 0.24.22, PostgreSQL 17"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      render: text
