name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR that only touches docs skips the work jobs; `check` still reports, so the PR can merge.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Did anything but docs change?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Files no check, build or package reads. LICENSE and NOTICE are not here: they go into the bundle.
          DOCS: '^(README|AGENTS|CLAUDE|CHANGELOG|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|RELEASING)\.md$|^docs/[^/]+\.md$|^\.github/(dependabot\.yml|rulesets/[^/]+\.json|pull_request_template\.md|CODEOWNERS|ISSUE_TEMPLATE/.+)$'
        run: |
          code=true
          if [ -n "$PR" ]; then
            # A renamed file counts under both names.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
            if [ -n "$files" ] && ! grep -qvE "$DOCS" <<<"$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # ktlint, detekt, unit tests, the bundle, and the integration tests: a real Kill Bill 0.24.22 and PostgreSQL in
  # Testcontainers with the bundle baked into the image. Needs no secrets, and never will: the live suite against
  # monobank's test token (tag `live`, excluded here) runs only in live.yml, by hand or nightly, from main.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp -Pdetekt verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  lint-workflows:
    name: lint-workflows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A plain docker run, not a docker:// step: the repository allows only GitHub-owned and listed actions.
      - name: Lint workflows
        env:
          ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # bump by hand
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT" -color

  # Push rulesets exist only for organisation repositories, so the same limits are checked here, on every PR
  # (docs-only ones too): no binaries, archives, keys or files over 5 MB.
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No binaries, keys or large files
        env:
          FORBIDDEN: '(^|/)(\.env(\..*)?|id_(rsa|ed25519|ecdsa)[^/]*)$|\.(jar|war|ear|zip|tar|tgz|gz|bz2|xz|7z|class|so|dll|exe|p12|pfx|jks|keystore|p8|der|pem|key)$'
        run: |
          bad=$(git ls-files | grep -iE "$FORBIDDEN" || true)
          big=$(git ls-files -z | xargs -0 -r stat --printf '%s\t%n\n' | awk -F '\t' '$1 > 5242880 { print $2 }')
          if [ -n "$bad$big" ]; then printf 'Not allowed in the repository:\n%s\n%s\n' "$bad" "$big"; exit 1; fi

  # New dependencies with known vulnerabilities or incompatible licences fail the PR. Only what the PR adds is checked,
  # as declared in pom.xml: transitive and parent-managed versions are not seen here (dependency-graph.yml submits the
  # full tree from main, for Dependabot alerts).
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, EPL-1.0, EPL-2.0, CDDL-1.0, CDDL-1.1, ISC, MPL-2.0,
            BlueOak-1.0.0, CC0-1.0, Unlicense, PostgreSQL, LGPL-2.1-or-later

  # The one required status check (.github/rulesets/main.json). Jobs skipped for a docs-only PR count as passed.
  check:
    name: check
    if: always()
    needs: [changes, build, lint-workflows, hygiene, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS" > /dev/null
