name: Publish to Maven Central

# Manual only. Run it on a release tag (vX.Y.Z) after RELEASING.md's checklist is done. The `check` job holds no
# secrets: it refuses anything but a release and re-runs the build checks. Only then does `publish` ask for approval of
# the `maven-central` environment, sign and upload a deployment to the Central Portal; the release becomes public only
# after the maintainer presses "Publish" in https://central.sonatype.com/publishing/deployments.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse anything but a release tag on main matching a release version
        run: |
          version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          sdk="$(./mvnw -B -q -ntp help:evaluate -Dexpression=monobank-sdk.version -DforceStdout | tr -d '[:space:]')"
          case "$version" in *SNAPSHOT*) echo "::error::The plugin version is a snapshot: $version"; exit 1;; esac
          case "$sdk" in *SNAPSHOT*) echo "::error::The monobank SDK is a snapshot: $sdk"; exit 1;; esac
          if grep -q 'install-monobank-sdk' .github/workflows/ci.yml; then
            echo "::error::CI still builds the SDK from a commit; depend on its Maven Central release"; exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/tags/v${version}" ]; then
            echo "::error::Run this workflow on tag v${version} (got ${GITHUB_REF})"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag v${version} is not on main"; exit 1
          fi
          echo "Releasing ${version} with the monobank SDK ${sdk}"

      - name: Build checks (unit, Kill Bill integration tests, ktlint, detekt)
        run: ./mvnw -B -ntp -Pdetekt clean verify

  publish:
    name: publish
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to run without credentials or signing key
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_SIGNING_KEY GPG_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in environment maven-central"; exit 1; fi
          done

      # Seconds, not a full build: the Central Portal accepts this user token, and this version isn't published yet.
      - name: The Central token works and the version is new
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          code="$(curl -sS -o answer.json -w '%{http_code}' -H "Authorization: Bearer $auth" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.damienmiheev&name=killbill-monobank-plugin&version=${version}")"
          case "$code" in
            200) ;;
            401|403) echo "::error::The Central Portal refused the token ($code): set a Portal user token, not the login"; exit 1;;
            *) echo "::error::The Central Portal answered $code"; exit 1;;
          esac
          if jq -e '.published == true' answer.json > /dev/null; then
            echo "::error::${version} is already published on Maven Central"; exit 1
          fi
          rm -f answer.json

      # Writes ~/.m2/settings.xml with server `central` (credentials from the env below). The signing key never
      # touches a keyring: maven-gpg-plugin signs in Maven from MAVEN_GPG_KEY (see the pom's release profile).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      # The checked commit, rebuilt and signed: the bundle, its sources and a javadoc jar (no test jars).
      - name: Upload to the Central Portal (waits there for Publish)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./mvnw -B -ntp -Psonatype-oss-release -DskipTests -DskipITs clean deploy
