config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    # ktlint puts every argument on its own line, which makes wiring code long.
    allowedLines: 80
  CyclomaticComplexMethod:
    # The validation of a payment operation lists every refusal in one place on purpose.
    allowedComplexity: 20
  LongParameterList:
    # Kill Bill's PaymentPluginApi fixes the parameter lists of its operations.
    active: false
  TooManyFunctions:
    # One method per Kill Bill operation.
    allowedFunctionsPerClass: 30
    allowedFunctionsPerFile: 30

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  MagicNumber:
    active: false
  ReturnCount:
    max: 5
    # Early returns for refusals and guards read better than nested conditions in payment code.
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    maxJumpCount: 2
  ThrowsCount:
    max: 3

exceptions:
  TooGenericExceptionCaught:
    # Deliberate at the plugin's boundaries (activator start, health, Kill Bill reads): every one is commented.
    active: false
